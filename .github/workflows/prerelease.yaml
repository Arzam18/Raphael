      - name: Setup SIMDe and Patch Source Files for ARM64
        run: |
          git clone --depth 1 https://github.com/simd-everywhere/simde.git
          python3 -c '
          import os

          # 1. Dynamically locate and patch Simd.h
          simd_path = None
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.lower() == "simd.h":
                      simd_path = os.path.join(root, file)
                      break
              if simd_path:
                  break

          if simd_path:
              with open(simd_path, "r", encoding="utf-8") as f:
                  content = f.read()

              arm_simde_block = """#if defined(__aarch64__) || defined(__ARM_NEON)
          #define SIMDE_ENABLE_NATIVE_ALIASES
          #include "simde/x86/avx2.h"
          #define USE_AVX2
          #define USE_SIMD 256
          #define ALIGNMENT 32
          #define SIMD_REGS 16
          using VecU8 = simde__m256i;
          using VecI8 = simde__m256i;
          using VecI16 = simde__m256i;
          using VecI32 = simde__m256i;
          #else
          """

              if "#pragma once" in content:
                  content = content.replace("#pragma once", "#pragma once\n" + arm_simde_block + "\n#endif")
              else:
                  content = arm_simde_block + content + "\n#endif"

              with open(simd_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Successfully patched Simd.h for ARM64.")

          # 2. Patch Raphael.cpp to fix variable-length array initialization error on Clang
          raphael_path = "src/Raphael/Raphael.cpp"
          if os.path.exists(raphael_path):
              with open(raphael_path, "r", encoding="utf-8") as f:
                  raphael_content = f.read()
              
              target_vla = "i32 thread_weights[thread_data_.size()] = {};"
              replacement = "std::vector<i32> thread_weights(thread_data_.size(), 0);"
              
              if target_vla in raphael_content:
                  raphael_content = raphael_content.replace(target_vla, replacement)
                  with open(raphael_path, "w", encoding="utf-8") as f:
                      f.write(raphael_content)
                  print("Successfully patched VLA in Raphael.cpp.")

          # 3. Patch datagen.cpp to fix thread array VLA error on Clang
          datagen_path = "src/Raphael/datagen.cpp"
          if os.path.exists(datagen_path):
              with open(datagen_path, "r", encoding="utf-8") as f:
                  datagen_content = f.read()
              
              target_vla_dg = "thread threads[concurrency];"
              replacement_dg = "std::vector<thread> threads(concurrency);"
              
              if target_vla_dg in datagen_content:
                  datagen_content = datagen_content.replace(target_vla_dg, replacement_dg)
                  with open(datagen_path, "w", encoding="utf-8") as f:
                      f.write(datagen_content)
                  print("Successfully patched VLA in datagen.cpp.")

          # 4. Patch accumulator.cpp to remove strict constexpr requirements for Clang compatibility
          acc_path = "src/eval/accumulator.cpp"
          if os.path.exists(acc_path):
              with open(acc_path, "r", encoding="utf-8") as f:
                  acc_content = f.read()
              
              acc_content = acc_content.replace("static constexpr auto PIECE_INDICES", "static const auto PIECE_INDICES")
              acc_content = acc_content.replace("static constexpr auto OFFSETS", "static const auto OFFSETS")
              acc_content = acc_content.replace("static constexpr auto ATTACK_INDICES", "static const auto ATTACK_INDICES")
              
              with open(acc_path, "w", encoding="utf-8") as f:
                  f.write(acc_content)
              print("Successfully patched all table initializations in accumulator.cpp.")

          # 5. Patch commands.cpp to fix absolute value truncation warning/error
          cmd_path = "src/Raphael/commands.cpp"
          if os.path.exists(cmd_path):
              with open(cmd_path, "r", encoding="utf-8") as f:
                  cmd_content = f.read()
              cmd_content = cmd_content.replace("abs_total += abs(eval);", "abs_total += std::abs(eval);")
              with open(cmd_path, "w", encoding="utf-8") as f:
                  f.write(cmd_content)

          # 6. Patch Makefile to remove x86-64 flag, add SIMDe path, and ignore harmless Clang warnings
          if os.path.exists("Makefile"):
              with open("Makefile", "r", encoding="utf-8") as f:
                  mk_content = f.read()
              
              mk_content = mk_content.replace("CCFLAGS_GENERIC     := -march=x86-64", "CCFLAGS_GENERIC     :=")
              mk_content = mk_content.replace("-Isrc", "-Isrc -I./simde -Wno-missing-braces -Wno-unused-variable -Wno-unused-but-set-variable")
              
              with open("Makefile", "w", encoding="utf-8") as f:
                  f.write(mk_content)
              print("Successfully patched Makefile.")
          '
