name: Raphael Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platforms;android-24"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;27.2.12479018"

          echo
          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed | grep -E \
            "platforms;android-24|build-tools;35.0.0|ndk;27.2.12479018" || true

      - name: Show toolchain
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_NDK_ROOT"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"

          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" --version

      - name: Download NNUE network
        shell: bash
        run: |
          set -e

          NET_NAME="$(tr -d '\r\n' < network.txt)"
          NET_FILE="${NET_NAME}.nnue"

          echo "Network: $NET_NAME"
          echo "File: $NET_FILE"

          curl -fL \
            "https://github.com/Orbital-Web/Raphael-Net/releases/download/${NET_NAME}/${NET_FILE}" \
            -o "$NET_FILE"

          test -s "$NET_FILE"

          ls -lh "$NET_FILE"

      - name: Build Raphael ARM64 NEON
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_NDK_ROOT"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          mkdir -p build

          NET_NAME="$(tr -d '\r\n' < network.txt)"
          NET_FILE="${NET_NAME}.nnue"

          CXXFLAGS="
            -std=c++20
            -O3
            -flto
            -march=armv8-a
            -fPIC
            -pthread
            -Wall
            -Wextra
            -Isrc
            -DEVAL_NNUE
            -DEVAL_MULTILAYER
            -DUSE_NEON
            -DUSE_SIMD=128
            -DALIGNMENT=16
            -DSIMD_REGS=8
            -DNETWORK_FILE=${NET_FILE}
          "

          echo "========================================"
          echo "Raphael Android ARM64 NEON"
          echo "Compiler: $CXX"
          echo "Network:  $NET_FILE"
          echo "========================================"

          SOURCES=(
            src/Raphael/*.cpp
            src/eval/*.cpp
            uci.cpp
          )

          echo "Compiling ${#SOURCES[@]} source files..."

          for src in "${SOURCES[@]}"; do
            obj="build/$(basename "${src%.cpp}").o"

            echo "----------------------------------------"
            echo "Compiling: $src"

            "$CXX" $CXXFLAGS \
              -c "$src" \
              -o "$obj"
          done

          echo "----------------------------------------"
          echo "Linking..."

          "$CXX" \
            -O3 \
            -flto \
            -march=armv8-a \
            -pthread \
            -fuse-ld=lld \
            -static-libstdc++ \
            -Wl,--gc-sections \
            build/*.o \
            -o build/raphael-android-arm64

          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          file build/raphael-android-arm64
          ls -lh build/raphael-android-arm64

      - name: Check Android binary
        shell: bash
        run: |
          set -e

          BINARY="build/raphael-android-arm64"
          LLVM_READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "========================================"
          echo "ELF INFORMATION"
          echo "========================================"

          file "$BINARY"

          echo
          echo "Dynamic dependencies:"
          "$LLVM_READELF" -d "$BINARY" || true

          echo
          echo "NEON / AArch64 compiler macros:"

          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            -march=armv8-a \
            -dM \
            -E \
            -x c++ /dev/null \
            | grep -E "__aarch64__|__ARM_NEON" || true

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: raphael-android-arm64
          path: build/raphael-android-arm64
          if-no-files-found: error
