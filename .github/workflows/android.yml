name: Raphael Android ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK environment
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            -print

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager exists but is not executable"
            ls -l "$SDKMANAGER"
            exit 1
          fi

          echo
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing Android platform..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platforms;android-24"

          echo
          echo "Installing build tools..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "build-tools;35.0.0"

          echo
          echo "Installing Android NDK..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "ndk;27.2.12479018"

          echo
          echo "Installed Android packages:"
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --list_installed || true

      - name: Configure NDK
        shell: bash
        run: |
          set -e

          NDK="$SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK was not installed:"
            echo "$NDK"
            exit 1
          fi

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: AArch64 Android compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "========================================"
          echo "NDK:"
          echo "$NDK"
          echo
          echo "Compiler:"
          echo "$CXX"
          echo "========================================"

          "$CXX" --version

      - name: Download NNUE network
        shell: bash
        run: |
          set -e

          NET_NAME="$(tr -d '\r\n' < network.txt)"
          NET_FILE="${NET_NAME}.nnue"

          echo "Network: $NET_NAME"
          echo "File: $NET_FILE"

          curl -fL \
            "https://github.com/Orbital-Web/Raphael-Net/releases/download/${NET_NAME}/${NET_FILE}" \
            -o "$NET_FILE"

          test -s "$NET_FILE"

          echo
          echo "Network downloaded:"
          ls -lh "$NET_FILE"

      - name: Build Raphael ARM64 NEON
        shell: bash
        run: |
          set -e

          mkdir -p build

          NET_NAME="$(tr -d '\r\n' < network.txt)"
          NET_FILE="${NET_NAME}.nnue"

          CXXFLAGS=(
            -std=c++20
            -O3
            -flto
            -march=armv8-a
            -fPIC
            -pthread
            -Wall
            -Wextra
            -Isrc
            -DEVAL_NNUE
            -DEVAL_MULTILAYER
            -DUSE_NEON
            -DUSE_SIMD=128
            -DALIGNMENT=16
            -DSIMD_REGS=8
            "-DNETWORK_FILE=${NET_FILE}"
          )

          echo "========================================"
          echo "Raphael Android ARM64 NEON"
          echo "========================================"
          echo "Compiler:"
          echo "$CXX"
          echo
          echo "Network:"
          echo "$NET_FILE"
          echo "========================================"

          SOURCES=(
            src/Raphael/*.cpp
            src/eval/*.cpp
            uci.cpp
          )

          echo
          echo "Source files: ${#SOURCES[@]}"
          echo

          for src in "${SOURCES[@]}"; do
            name="$(echo "$src" | tr '/' '_')"
            obj="build/${name%.cpp}.o"

            echo "----------------------------------------"
            echo "Compiling: $src"
            echo "Object:    $obj"

            "$CXX" \
              "${CXXFLAGS[@]}" \
              -c "$src" \
              -o "$obj"
          done

          echo
          echo "========================================"
          echo "Linking Raphael..."
          echo "========================================"

          "$CXX" \
            -O3 \
            -flto \
            -march=armv8-a \
            -pthread \
            -fuse-ld=lld \
            -static-libstdc++ \
            -Wl,--gc-sections \
            build/*.o \
            -o build/raphael-android-arm64

          echo
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          file build/raphael-android-arm64
          ls -lh build/raphael-android-arm64

      - name: Check Android ELF
        shell: bash
        run: |
          set -e

          BINARY="build/raphael-android-arm64"
          READELF="$TOOLCHAIN/bin/llvm-readelf"

          echo "========================================"
          echo "ELF INFORMATION"
          echo "========================================"

          file "$BINARY"

          echo
          echo "Architecture:"
          "$READELF" -h "$BINARY" | grep -E \
            "Class:|Machine:|Type:" || true

          echo
          echo "Dynamic dependencies:"
          "$READELF" -d "$BINARY" || true

          echo
          echo "AArch64 / NEON compiler macros:"

          "$CXX" \
            -march=armv8-a \
            -dM \
            -E \
            -x c++ /dev/null \
            | grep -E "__aarch64__|__ARM_NEON" || true

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: raphael-android-arm64
          path: build/raphael-android-arm64
          if-no-files-found: error
